<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Battery icon -->
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="160" text-anchor="middle">🔋</text>
  
  <!-- Lightning bolt -->
  <text x="540" y="450" font-family="Arial, sans-serif" font-size="100" fill="#ffcc00" text-anchor="middle">⚡</text>
  
  <!-- Main text -->
  <text x="540" y="570" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">BATTERY PROBLEMS?</text>
  
  <!-- Symptoms list -->
  <text x="540" y="680" font-family="Arial, sans-serif" font-size="32" fill="#e94560" text-anchor="middle">• Slow crank when starting</text>
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="32" fill="#e94560" text-anchor="middle">• Electrical issues at idle</text>
  <text x="540" y="780" font-family="Arial, sans-serif" font-size="32" fill="#e94560" text-anchor="middle">• Battery older than 4 years</text>
  
  <!-- CTA -->
  <rect x="290" y="850" width="500" height="80" rx="40" fill="#e94560"/>
  <text x="540" y="905" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Tagline -->
  <text x="540" y="1000" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Mobile Testing • Replacement • Charging System Checks</text>
</svg>