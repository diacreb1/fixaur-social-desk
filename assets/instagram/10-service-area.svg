<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Map pin -->
  <text x="540" y="220" font-family="Arial, sans-serif" font-size="140" text-anchor="middle">📍</text>
  
  <!-- Brand -->
  <text x="540" y="360" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">FIXAUR</text>
  <text x="540" y="420" font-family="Arial, sans-serif" font-size="28" fill="#e94560" text-anchor="middle">MOBILE MECHANIC</text>
  
  <!-- Service area boxes -->
  <rect x="140" y="480" width="800" height="100" rx="20" fill="#0f3460" stroke="#e94560" stroke-width="3"/>
  <text x="540" y="545" font-family="Arial Black, sans-serif" font-size="48" fill="white" text-anchor="middle">🇨🇦 SERVICE AREA</text>
  
  <!-- Cities -->
  <rect x="140" y="610" width="250" height="80" rx="15" fill="#e94560"/>
  <text x="265" y="660" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">SASKATOON</text>
  
  <rect x="415" y="610" width="250" height="80" rx="15" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="540" y="660" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">WARMAN</text>
  
  <rect x="690" y="610" width="250" height="80" rx="15" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="815" y="660" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">MARTENSVILLE</text>
  
  <!-- Locations list -->
  <text x="540" y="770" font-family="Arial, sans-serif" font-size="26" fill="#cccccc" text-anchor="middle">Homes • Workplaces • Driveways</text>
  <text x="540" y="810" font-family="Arial, sans-serif" font-size="26" fill="#cccccc" text-anchor="middle">Parking Lots • Safe Roadside</text>
  
  <!-- CTA -->
  <rect x="290" y="870" width="500" height="80" rx="40" fill="#e94560"/>
  <text x="540" y="925" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
