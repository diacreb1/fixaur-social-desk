<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Truck icons -->
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="140" text-anchor="middle">🚛</text>
  
  <!-- Briefcase -->
  <text x="540" y="430" font-family="Arial, sans-serif" font-size="120" text-anchor="middle">💼</text>
  
  <!-- Main text -->
  <text x="540" y="540" font-family="Arial Black, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">FLEET SERVICES</text>
  
  <!-- Subtext -->
  <text x="540" y="620" font-family="Arial, sans-serif" font-size="32" fill="#cccccc" text-anchor="middle">Small fleet or work vehicle?</text>
  
  <!-- Pain point -->
  <text x="540" y="700" font-family="Arial, sans-serif" font-size="36" fill="#e94560" text-anchor="middle">Downtime = Lost money</text>
  
  <!-- Benefits -->
  <text x="540" y="780" font-family="Arial, sans-serif" font-size="28" fill="#4ade80" text-anchor="middle">✓ We come to your location</text>
  <text x="540" y="820" font-family="Arial, sans-serif" font-size="28" fill="#4ade80" text-anchor="middle">✓ On-site when work allows</text>
  
  <!-- CTA -->
  <rect x="290" y="880" width="500" height="80" rx="40" fill="#e94560"/>
  <text x="540" y="935" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Business focus -->
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Business Vehicles • Commercial Fleets</text>
</svg>