<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Check engine light -->
  <circle cx="540" cy="280" r="100" fill="#e94560"/>
  <text x="540" y="310" font-family="Arial, sans-serif" font-size="120" fill="white" text-anchor="middle">⚠️</text>
  
  <!-- Magnifying glass / diagnostic -->
  <text x="540" y="480" font-family="Arial, sans-serif" font-size="180" text-anchor="middle">🔍</text>
  
  <!-- Main text -->
  <text x="540" y="590" font-family="Arial Black, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">CHECK ENGINE LIGHT?</text>
  
  <!-- Subtext -->
  <text x="540" y="660" font-family="Arial, sans-serif" font-size="32" fill="#cccccc" text-anchor="middle">Electrical issue? Strange drivability?</text>
  <text x="540" y="710" font-family="Arial, sans-serif" font-size="32" fill="#cccccc" text-anchor="middle">We bring diagnostics to you</text>
  
  <!-- Promise -->
  <text x="540" y="790" font-family="Arial, sans-serif" font-size="28" fill="#4ade80" text-anchor="middle">✓ Clear next steps before work begins</text>
  <text x="540" y="830" font-family="Arial, sans-serif" font-size="28" fill="#4ade80" text-anchor="middle">✓ No surprises</text>
  
  <!-- CTA -->
  <rect x="290" y="890" width="500" height="80" rx="40" fill="#e94560"/>
  <text x="540" y="945" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
</svg>