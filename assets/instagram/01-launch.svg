<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="900" r="200" fill="#e94560" opacity="0.1"/>
  <circle cx="980" cy="180" r="250" fill="#ff6b6b" opacity="0.1"/>
  
  <!-- Top badge -->
  <rect x="340" y="80" width="400" height="50" rx="25" fill="url(#accent)"/>
  <text x="540" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">🇨🇦 SASKATOON, WARMAN & MARTENSVILLE</text>
  
  <!-- Main icon - mobile mechanic van -->
  <circle cx="540" cy="380" r="120" fill="#0f3460" stroke="#e94560" stroke-width="4"/>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="100" text-anchor="middle">🚐</text>
  
  <!-- Wrench icon -->
  <text x="540" y="580" font-family="Arial, sans-serif" font-size="120" text-anchor="middle">🔧</text>
  
  <!-- Brand name -->
  <text x="540" y="720" font-family="Arial Black, sans-serif" font-size="100" font-weight="bold" fill="white" text-anchor="middle">FIXAUR</text>
  
  <!-- Tagline -->
  <text x="540" y="790" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">MOBILE MECHANIC</text>
  
  <!-- Service list -->
  <text x="540" y="860" font-family="Arial, sans-serif" font-size="28" fill="#e94560" text-anchor="middle">Diagnostics • Batteries • Brakes • Oil • Tires</text>
  
  <!-- CTA -->
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom text -->
  <text x="540" y="1010" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">WE COME TO YOU</text>
</svg>