<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="900" r="200" fill="#f97316" opacity="0.1"/>
  <circle cx="980" cy="180" r="250" fill="#2563eb" opacity="0.1"/>
  
  <!-- Top badge -->
  <rect x="340" y="80" width="400" height="50" rx="25" fill="url(#orange)"/>
  <text x="540" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">🚗 CAR WON'T START?</text>
  
  <!-- Main icon - car with X -->
  <circle cx="540" cy="380" r="120" fill="#0f3460" stroke="#f97316" stroke-width="4"/>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="100" text-anchor="middle">🚗❌</text>
  
  <!-- Arrow down -->
  <text x="540" y="560" font-family="Arial, sans-serif" font-size="80" fill="#2563eb" text-anchor="middle">⬇</text>
  
  <!-- Wrench icon -->
  <circle cx="540" cy="680" r="80" fill="#0f3460" stroke="#2563eb" stroke-width="3"/>
  <text x="540" y="700" font-family="Arial, sans-serif" font-size="70" text-anchor="middle">🔧</text>
  
  <!-- Brand name -->
  <text x="540" y="800" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">FIXAUR CAN HELP</text>
  
  <!-- Tagline -->
  <text x="540" y="860" font-family="Arial, sans-serif" font-size="28" fill="#cccccc" text-anchor="middle">We assess common no-start issues on-site</text>
  
  <!-- CTA -->
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom text -->
  <text x="540" y="1010" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Saskatoon • Warman • Martensville</text>
</svg>