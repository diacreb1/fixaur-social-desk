<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="900" r="200" fill="#f97316" opacity="0.1"/>
  <circle cx="980" cy="180" r="250" fill="#2563eb" opacity="0.1"/>
  
  <!-- Top badge -->
  <rect x="340" y="80" width="400" height="50" rx="25" fill="#dc2626"/>
  <text x="540" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">⚠️ BRAKE PROBLEMS?</text>
  
  <!-- Symptoms row -->
  <g font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle">
    <rect x="100" y="200" width="200" height="100" rx="15" fill="#7f1d1d"/>
    <text x="200" y="255">🔇 Squealing</text>
    
    <rect x="320" y="200" width="200" height="100" rx="15" fill="#7f1d1d"/>
    <text x="420" y="255">🌀 Grinding</text>
    
    <rect x="540" y="200" width="200" height="100" rx="15" fill="#7f1d1d"/>
    <text x="640" y="255">📳 Shaking</text>
    
    <rect x="760" y="200" width="200" height="100" rx="15" fill="#7f1d1d"/>
    <text x="860" y="255">🦶 Soft Pedal</text>
  </g>
  
  <!-- Don't ignore -->
  <text x="540" y="380" font-family="Arial, sans-serif" font-size="32" fill="#dc2626" text-anchor="middle">Don't ignore brake concerns</text>
  
  <!-- Divider -->
  <rect x="290" y="420" width="500" height="3" rx="2" fill="#333333"/>
  
  <!-- Solution icon -->
  <circle cx="540" cy="540" r="80" fill="#0f3460" stroke="#2563eb" stroke-width="3"/>
  <text x="540" y="565" font-family="Arial, sans-serif" font-size="70" text-anchor="middle">🛡️</text>
  
  <!-- Brand name -->
  <text x="540" y="670" font-family="Arial Black, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">FIXAUR CAN ASSESS</text>
  
  <!-- Tagline -->
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="26" fill="#cccccc" text-anchor="middle">Brake pads, rotors, lines — on-site</text>
  
  <!-- CTA -->
  <text x="540" y="830" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom text -->
  <text x="540" y="900" font-family="Arial, sans-serif" font-size="22" fill="#888888" text-anchor="middle">Licensed &amp; Insured • Honest Pricing</text>
  <text x="540" y="950" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Saskatoon • Warman • Martensville</text>
</svg>