<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="900" r="200" fill="#22c55e" opacity="0.1"/>
  <circle cx="980" cy="180" r="250" fill="#2563eb" opacity="0.1"/>
  
  <!-- Top badge -->
  <rect x="340" y="80" width="400" height="50" rx="25" fill="url(#accent)"/>
  <text x="540" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">⚠️ CHECK ENGINE LIGHT?</text>
  
  <!-- Main icon - wrench -->
  <circle cx="540" cy="360" r="120" fill="#0f3460" stroke="#2563eb" stroke-width="4"/>
  <text x="540" y="385" font-family="Arial, sans-serif" font-size="100" text-anchor="middle">🔧</text>
  
  <!-- Concerns -->
  <text x="540" y="530" font-family="Arial, sans-serif" font-size="26" fill="#cccccc" text-anchor="middle">Electrical issue? Strange noise? Drivability problem?</text>
  
  <!-- Divider -->
  <rect x="290" y="570" width="500" height="3" rx="2" fill="#333333"/>
  
  <!-- Solution -->
  <text x="540" y="650" font-family="Arial Black, sans-serif" font-size="48" font-weight="bold" fill="#22c55e" text-anchor="middle">FIXAUR DIAGNOSTICS</text>
  
  <!-- What we do -->
  <text x="540" y="720" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle">✓ We scan &amp; explain</text>
  <text x="540" y="765" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle">✓ Clear next steps — before any work</text>
  
  <!-- Promise -->
  <text x="540" y="850" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">"Honest answers before any work begins"</text>
  
  <!-- CTA -->
  <text x="540" y="940" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom text -->
  <text x="540" y="1010" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Saskatoon • Warman • Martensville</text>
</svg>