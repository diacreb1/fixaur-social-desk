<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="900" r="200" fill="#2563eb" opacity="0.1"/>
  <circle cx="980" cy="180" r="250" fill="#f97316" opacity="0.1"/>
  
  <!-- Map pin icon -->
  <circle cx="540" cy="150" r="80" fill="#0f3460" stroke="#2563eb" stroke-width="3"/>
  <text x="540" y="175" font-family="Arial, sans-serif" font-size="80" text-anchor="middle">📍</text>
  
  <!-- Brand name -->
  <text x="540" y="300" font-family="Arial Black, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">FIXAUR</text>
  <text x="540" y="355" font-family="Arial, sans-serif" font-size="28" fill="#cccccc" text-anchor="middle">MOBILE MECHANIC</text>
  
  <!-- Service Area badge -->
  <rect x="340" y="400" width="400" height="50" rx="25" fill="url(#accent)"/>
  <text x="540" y="435" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">🇨🇦 SERVICE AREA</text>
  
  <!-- Three city cards -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <!-- Saskatoon - Primary -->
    <rect x="100" y="500" width="280" height="140" rx="20" fill="#2563eb"/>
    <text x="240" y="560" font-size="32" font-weight="bold" fill="white">SASKATOON</text>
    <text x="240" y="605" font-size="20" fill="#bfdbfe">Primary Service Area</text>
    
    <!-- Warman -->
    <rect x="400" y="500" width="280" height="140" rx="20" fill="#0f3460" stroke="#2563eb" stroke-width="2"/>
    <text x="540" y="560" font-size="32" font-weight="bold" fill="white">WARMAN</text>
    <text x="540" y="605" font-size="20" fill="#94a3b8">North</text>
    
    <!-- Martensville -->
    <rect x="700" y="500" width="280" height="140" rx="20" fill="#0f3460" stroke="#2563eb" stroke-width="2"/>
    <text x="840" y="560" font-size="28" font-weight="bold" fill="white">MARTENSVILLE</text>
    <text x="840" y="605" font-size="20" fill="#94a3b8">North</text>
  </g>
  
  <!-- Where we go -->
  <text x="540" y="710" font-family="Arial, sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">🏠 Homes • 🏢 Workplaces • 🚗 Driveways</text>
  <text x="540" y="755" font-family="Arial, sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">🅿️ Parking Lots • 🛣️ Safe Roadside</text>
  
  <!-- CTA -->
  <text x="540" y="870" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom tagline -->
  <rect x="0" y="920" width="1080" height="160" fill="#0f3460"/>
  <text x="540" y="990" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Fast. Honest. Mobile.</text>
  <text x="540" y="1050" font-family="Arial, sans-serif" font-size="20" fill="#888888" text-anchor="middle">Honest Pricing • No Hidden Fees • Licensed &amp; Insured</text>
</svg>