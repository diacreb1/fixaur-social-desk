<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)"/>
  
  <!-- Warning triangle -->
  <polygon points="540,100 680,280 400,280" fill="none" stroke="#ffcc00" stroke-width="8"/>
  <text x="540" y="240" font-family="Arial" font-size="80" fill="#ffcc00" text-anchor="middle">⚠️</text>
  
  <!-- Sad car emoji -->
  <text x="540" y="420" font-family="Arial, sans-serif" font-size="180" text-anchor="middle">🚗</text>
  <text x="540" y="520" font-family="Arial, sans-serif" font-size="60" fill="#e94560" text-anchor="middle">💀</text>
  
  <!-- Main text -->
  <text x="540" y="640" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">CAR WON'T START?</text>
  
  <!-- Subtext -->
  <text x="540" y="720" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">We assess common no-start issues</text>
  <text x="540" y="770" font-family="Arial, sans-serif" font-size="36" fill="#cccccc" text-anchor="middle">at your location</text>
  
  <!-- CTA box -->
  <rect x="290" y="830" width="500" height="80" rx="40" fill="#e94560"/>
  <text x="540" y="885" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Location -->
  <text x="540" y="980" font-family="Arial, sans-serif" font-size="28" fill="#888888" text-anchor="middle">Saskatoon • Warman • Martensville</text>
</svg>