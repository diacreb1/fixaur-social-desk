<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="warning2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="danger2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg2)"/>
  
  <!-- Problem/Solution layout: Top = Problem, Bottom = Solution -->
  
  <!-- Problem Section -->
  <rect x="0" y="0" width="1080" height="480" fill="#991b1b" fill-opacity="0.3"/>
  
  <!-- Warning badge -->
  <circle cx="540" cy="140" r="80" fill="url(#warning2)"/>
  <text x="540" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="90">⚠️</text>
  
  <!-- Problem text -->
  <text x="540" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#fef3c7" text-anchor="middle">CAR WON'T START?</text>
  <text x="540" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#fcd34d" text-anchor="middle">The worst feeling in Saskatoon winter ❄️</text>
  
  <!-- Divider with arrow -->
  <polygon points="520,440 540,470 560,440" fill="#3b82f6"/>
  <line x1="540" y1="470" x2="540" y2="520" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Solution Section -->
  <rect x="0" y="480" width="1080" height="600" fill="#1e3a5f"/>
  
  <!-- Solution icon -->
  <circle cx="540" cy="580" r="70" fill="#3b82f6"/>
  <text x="540" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="70">🔧</text>
  
  <!-- Solution text -->
  <text x="540" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="white" text-anchor="middle">WE COME TO YOU</text>
  <text x="540" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#93c5fd" text-anchor="middle">Assess on-site when safe &amp; practical</text>
  
  <!-- Locations -->
  <text x="540" y="860" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Saskatoon • Warman • Martensville</text>
  
  <!-- CTA -->
  <rect x="290" y="900" width="500" height="80" rx="40" fill="url(#danger2)"/>
  <text x="540" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">📞 306-992-2827</text>
</svg>