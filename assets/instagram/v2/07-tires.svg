<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="winter7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="snow7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg7)"/>
  
  <!-- Snow overlay effect -->
  <ellipse cx="540" cy="200" rx="400" ry="200" fill="url(#snow7)"/>
  
  <!-- Snowflake icon -->
  <text x="540" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="140">❄️</text>
  
  <!-- Winter badge -->
  <rect x="390" y="230" width="300" height="45" rx="22" fill="url(#winter7)"/>
  <text x="540" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">SASKATOON WINTER READY</text>
  
  <!-- Main text -->
  <text x="540" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle">TIRE</text>
  <text x="540" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#winter7)" text-anchor="middle">SEASON</text>
  
  <!-- Tire icon -->
  <circle cx="540" cy="600" r="100" fill="#1e293b" stroke="url(#winter7)" stroke-width="4"/>
  <text x="540" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="100">🛞</text>
  
  <!-- Services -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">
    <text x="540" y="780">🔄 Seasonal Changeover</text>
    <text x="540" y="840">↻ Rotation &amp; Inspection</text>
  </g>
  
  <!-- Requirement callout -->
  <rect x="290" y="890" width="500" height="70" rx="35" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#93c5fd" text-anchor="middle">Just need a safe, level spot to work 📍</text>
  
  <!-- CTA -->
  <rect x="290" y="980" width="500" height="70" rx="35" fill="url(#winter7)"/>
  <text x="540" y="1028" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">📞 306-992-2827</text>
</svg>