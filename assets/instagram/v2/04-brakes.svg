<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="red4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="blue4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg4)"/>
  
  <!-- Us vs Them layout: Left = Problem, Right = Solution -->
  
  <!-- Left side (Problem) -->
  <rect x="0" y="0" width="540" height="1080" fill="#7f1d1d" fill-opacity="0.4"/>
  
  <!-- Problem header -->
  <rect x="40" y="60" width="460" height="60" rx="10" fill="#dc2626"/>
  <text x="270" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">⚠️ IGNORED</text>
  
  <!-- Problem symptoms -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#fca5a5" text-anchor="middle">
    <text x="270" y="220">🔇 Squealing</text>
    <text x="270" y="310">🌀 Grinding</text>
    <text x="270" y="400">📳 Shaking</text>
    <text x="270" y="490">🦶 Soft Pedal</text>
  </g>
  
  <!-- Warning icon -->
  <circle cx="270" cy="620" r="80" fill="#991b1b" stroke="#ef4444" stroke-width="4"/>
  <text x="270" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="80">🚨</text>
  
  <!-- Warning text -->
  <text x="270" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#fca5a5" text-anchor="middle">Becomes dangerous</text>
  <text x="270" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#fca5a5" text-anchor="middle">&amp; expensive</text>
  
  <!-- Right side (Solution) -->
  <rect x="540" y="0" width="540" height="1080" fill="#1e3a5f" fill-opacity="0.6"/>
  
  <!-- Solution header -->
  <rect x="580" y="60" width="460" height="60" rx="10" fill="#3b82f6"/>
  <text x="810" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">✅ FIXAUR</text>
  
  <!-- Solution benefits -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#bfdbfe" text-anchor="middle">
    <text x="810" y="220">🔍 Inspect</text>
    <text x="810" y="310">📋 Assess</text>
    <text x="810" y="400">🔧 Repair</text>
    <text x="810" y="490">🛡️ Protect</text>
  </g>
  
  <!-- Solution icon -->
  <circle cx="810" cy="620" r="80" fill="#1e3a5f" stroke="#3b82f6" stroke-width="4"/>
  <text x="810" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="80">🔧</text>
  
  <!-- Location text -->
  <text x="810" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#93c5fd" text-anchor="middle">On-site assessment</text>
  <text x="810" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#93c5fd" text-anchor="middle">where vehicle is parked</text>
  
  <!-- CTA -->
  <rect x="590" y="900" width="400" height="80" rx="40" fill="url(#blue4)"/>
  <text x="790" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">📞 306-992-2827</text>
</svg>