<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg1)"/>
  
  <!-- Decorative elements -->
  <circle cx="540" cy="300" r="350" fill="url(#glow1)"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent1)"/>
  
  <!-- Location badge -->
  <rect x="340" y="60" width="400" height="48" rx="24" fill="#1e293b" stroke="url(#accent1)" stroke-width="2"/>
  <text x="540" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">SASKATOON • WARMAN • MARTENSVILLE</text>
  
  <!-- Main icon area -->
  <circle cx="540" cy="320" r="140" fill="#1e293b" stroke="url(#accent1)" stroke-width="3" filter="url(#shadow1)"/>
  <text x="540" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="100">🚐</text>
  
  <!-- Brand name -->
  <text x="540" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">FIXAUR</text>
  
  <!-- Tagline with gradient -->
  <text x="540" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#accent1)" text-anchor="middle">MOBILE MECHANIC</text>
  
  <!-- Divider -->
  <line x1="290" y1="680" x2="790" y2="680" stroke="url(#accent1)" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Services grid -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#cbd5e1" text-anchor="middle">
    <text x="270" y="750">🔧 Diagnostics</text>
    <text x="540" y="750">🔋 Batteries</text>
    <text x="810" y="750">🛑 Brakes</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#cbd5e1" text-anchor="middle">
    <text x="270" y="800">🛢️ Oil</text>
    <text x="540" y="800">🛞</text>
    <text x="810" y="800">📍 Anywhere</text>
  </g>
  
  <!-- CTA -->
  <rect x="290" y="870" width="500" height="90" rx="45" fill="url(#accent1)"/>
  <text x="540" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">📞 306-992-2827</text>
  
  <!-- Bottom tagline -->
  <text x="540" y="1010" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b" text-anchor="middle" letter-spacing="4">WE COME TO YOU</text>
</svg>