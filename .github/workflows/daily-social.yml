name: Daily social content
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-social
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Generate five posts and images
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: node scripts/generate-daily-social.mjs
      - name: Commit daily content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-posts.json public/generated/daily
          git commit -m "chore: generate daily social content" || echo "No content changes"
          git push || true
      - name: Create approval notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%F)
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Fixaur social approval $date" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Fixaur social approval $date" --assignee diacreb1 --body "Review the five draft posts and generated images in src/data/daily-posts.json and public/generated/daily/$date before sending approved posts to GHL."
          fi
