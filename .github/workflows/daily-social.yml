name: Daily Fixaur content

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-fixaur-content
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate five posts and images
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          POST_DATE: ${{ github.run_started_at }}
        run: node scripts/generate-daily-social.mjs
      - name: Validate social output
        env:
          CONTENT_KIND: social
          POST_DATE: ${{ github.run_started_at }}
        run: node scripts/validate-daily-content.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: social-output
          path: |
            public/data/daily-posts.json
            public/generated/daily
          if-no-files-found: ignore

  blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate five blogs and images
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          POST_DATE: ${{ github.run_started_at }}
        run: node scripts/generate-daily-blogs.mjs
      - name: Validate blog output
        env:
          CONTENT_KIND: blogs
          POST_DATE: ${{ github.run_started_at }}
        run: node scripts/validate-daily-content.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blog-output
          path: |
            public/data/daily-blogs.json
            public/generated/blogs
          if-no-files-found: ignore

  publish:
    if: always()
    needs: [social, blogs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: social-output
          path: .artifacts/social
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: blog-output
          path: .artifacts/blogs
      - name: Preserve and publish available output
        run: |
          if [ -d .artifacts/social/data ]; then cp -R .artifacts/social/data/. public/data/; fi
          if [ -d .artifacts/social/generated ]; then cp -R .artifacts/social/generated/. public/generated/; fi
          if [ -d .artifacts/blogs/data ]; then cp -R .artifacts/blogs/data/. public/data/; fi
          if [ -d .artifacts/blogs/generated ]; then cp -R .artifacts/blogs/generated/. public/generated/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily-posts.json public/data/daily-blogs.json public/generated/daily public/generated/blogs
          git commit -m "chore: generate daily social content" || echo "No content changes"
          git pull --rebase origin main
          git push
      - name: Create approval notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%F)
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Fixaur content approval $date" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Fixaur content approval $date" --assignee diacreb1 --body "Review today's draft social posts and blogs before approval. Social job: ${{ needs.social.result }}. Blog job: ${{ needs.blogs.result }}. The publish step preserves the previous valid file whenever a generator fails."
          fi
      - name: Write run report
        if: always()
        run: |
          mkdir -p .run-report
          cat > .run-report/daily-content.txt <<EOF
          date=$(date -u +%F)
          social=${{ needs.social.result }}
          blogs=${{ needs.blogs.result }}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-content-report
          path: .run-report/daily-content.txt

  outreach-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OUTREACH_DAILY_TARGET: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create daily outreach approval issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%F)
          verified=$(node -e 'const x=require("./public/data/outreach-contacts.json"); console.log(x.filter(r=>r.emailStatus==="verified" && r.email).map(r=>`- ${r.firstName} at ${r.company} (${r.email})`).join("\n") || "- None")')
          blocked=$(node -e 'const x=require("./public/data/outreach-contacts.json"); console.log(x.filter(r=>!r.email || r.emailStatus!=="verified").map(r=>`- ${r.firstName || "Contact"} at ${r.company}`).join("\n") || "- None")')
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Fixaur outreach approval $date" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Fixaur outreach approval $date" --assignee diacreb1 --body "Daily target: $OUTREACH_DAILY_TARGET approval-gated emails. Review today's drafts in the app.\n\nVerified business-email drafts:\n$verified\n\nBlocked until Apollo returns a verified email:\n$blocked\n\nNo email is sent automatically by this job."
          fi
